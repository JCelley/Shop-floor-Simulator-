name: Deploy to GitHub Pages

# Builds dist/nc-floor-sim.html from source on every push to main and publishes ONLY that one
# file to GitHub Pages - never the repo itself, so fixtures/ (real customer job data) never
# reaches the deployed page even though the repo is public. See CLAUDE.md: "Keep the deliverable
# a single HTML file... Never bundle fixture files into the deployed page."

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npm run build
      - name: Stage only the built page for Pages
        run: |
          mkdir -p _site
          cp dist/nc-floor-sim.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
