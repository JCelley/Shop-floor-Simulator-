<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#e8e9ec}</style></head>
<body>
<script src="../node_modules/three/build/three.min.js"></script>
<script>
async function main() {
  const d = window.__FUSED_DATA;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 10000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0xe8e9ec, 1);
  document.body.appendChild(renderer.domElement);

  function addMesh(meshData, color, opacity) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(meshData.pos), 3));
    geo.setIndex(new THREE.BufferAttribute(new Uint32Array(meshData.idx), 1));
    geo.computeVertexNormals();
    const mat = new THREE.MeshLambertMaterial({ color, side: THREE.DoubleSide, transparent: opacity < 1, opacity });
    scene.add(new THREE.Mesh(geo, mat));
  }
  // sim (this program's simulated result) solid green, real finished PART.stl translucent orange for reference
  addMesh(d.sim, 0x1f9e4a, 0.95);
  addMesh(d.part, 0xff8a3d, 0.35);

  for (const m of d.markers) {
    const g = new THREE.SphereGeometry(m.r || 2, 16, 16);
    const mat = new THREE.MeshBasicMaterial({ color: m.color });
    const s = new THREE.Mesh(g, mat);
    s.position.set(m.pos[0], m.pos[1], m.pos[2]);
    scene.add(s);
  }

  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const dl = new THREE.DirectionalLight(0xffffff, 0.8); dl.position.set(1, 2, 3); scene.add(dl);
  const dl2 = new THREE.DirectionalLight(0xffffff, 0.4); dl2.position.set(-2, -1, -1); scene.add(dl2);

  const cx = (d.box.xmin + d.box.xmax) / 2, cy = (d.box.ymin + d.box.ymax) / 2, cz = (d.box.zbot + d.box.ztop) / 2;
  const size = Math.max(d.box.xmax - d.box.xmin, d.box.ymax - d.box.ymin, d.box.ztop - d.box.zbot);
  camera.up.set(0, 0, 1);
  const angle = +(new URLSearchParams(location.search).get('angle')) || 0;
  if (angle === 0) camera.position.set(cx + size * 0.9, cy - size * 1.1, cz + size * 0.75);
  else if (angle === 1) camera.position.set(cx - size * 1.1, cy - size * 0.15, cz + size * 0.7);
  else if (angle === 2) camera.position.set(cx, cy - size * 0.01, cz + size * 1.7); // top-down
  camera.lookAt(cx, cy, cz);

  renderer.render(scene, camera);
  window.__rendered = true;
}
main();
</script>
</body></html>
