<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#1b1e24}</style></head>
<body>
<script src="../node_modules/three/build/three.min.js"></script>
<script>
async function main() {
  const d = window.__FUSED_DATA;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 10000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(d.pos), 3));
  geo.setIndex(new THREE.BufferAttribute(new Uint32Array(d.idx), 1));
  geo.computeVertexNormals();
  const mat = new THREE.MeshLambertMaterial({ color: 0x35c463, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);

  const wire = new THREE.LineSegments(new THREE.WireframeGeometry(geo), new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.15 }));
  scene.add(wire);

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dl = new THREE.DirectionalLight(0xffffff, 0.8); dl.position.set(1, 2, 3); scene.add(dl);
  const dl2 = new THREE.DirectionalLight(0xffffff, 0.4); dl2.position.set(-2, -1, -1); scene.add(dl2);

  const cx = (d.box.xmin + d.box.xmax) / 2, cy = (d.box.ymin + d.box.ymax) / 2, cz = (d.box.zbot + d.box.ztop) / 2;
  const size = Math.max(d.box.xmax - d.box.xmin, d.box.ymax - d.box.ymin, d.box.ztop - d.box.zbot);
  camera.up.set(0, 0, 1);
  const angle = +(new URLSearchParams(location.search).get('angle')) || 0;
  if (angle === 0) camera.position.set(cx + size * 1.3, cy - size * 1.6, cz + size * 1.1);
  else if (angle === 1) camera.position.set(cx - size * 1.6, cy - size * 0.2, cz + size * 1.0);
  else if (angle === 2) camera.position.set(cx, cy - size * 0.01, cz + size * 3); // top-down
  camera.lookAt(cx, cy, cz);

  renderer.render(scene, camera);
  window.__rendered = true;
}
main();
</script>
</body></html>
